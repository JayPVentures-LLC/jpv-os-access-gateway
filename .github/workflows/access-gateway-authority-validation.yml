name: Access Gateway Authority Validation

on:
  pull_request:
    paths:
      - 'authority/**'
      - 'docs/COMMERCIAL-ACCESS-SETUP.md'
      - 'docs/governance/access-gateway-authority-validation.md'
      - 'scripts/validate-access-gateway-authority.mjs'
      - '.github/workflows/access-gateway-authority-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-access-gateway-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate access gateway authority
        run: node scripts/validate-access-gateway-authority.mjs
