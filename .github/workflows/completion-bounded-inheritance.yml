name: Completion-Bounded Governance Inheritance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate completion-bounded inheritance
        shell: pwsh
        run: ./scripts/Test-JPVCompletionBoundedInheritance.ps1
