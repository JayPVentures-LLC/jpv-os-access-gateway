name: Completion-Bounded Governance Inheritance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate completion-bounded inheritance
        shell: pwsh
        run: ./scripts/Test-JPVCompletionBoundedInheritance.ps1
