name: JPV .NET CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore JPVOS.sln

      - name: Build
        run: dotnet build JPVOS.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test JPVOS.sln --configuration Release --no-build --verbosity normal
