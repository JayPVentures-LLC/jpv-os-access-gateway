name: Release Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-web:
    name: Publish ASP.NET Core Web App
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/JPVOS/JPVOS.csproj

      - name: Build
        run: dotnet build src/JPVOS/JPVOS.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish src/JPVOS/JPVOS.csproj -c Release -o publish --no-build

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jpvos-release
          path: publish
