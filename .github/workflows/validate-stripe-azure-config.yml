name: Validate Stripe Azure Configuration

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Validate required source files
        shell: pwsh
        run: |
          $required = @(
            "authority/canonical-pricing-consumer.json",
            "scripts/validate-canonical-pricing.mjs",
            "scripts/configure-full-stripe-pricing.ps1",
            "scripts/Invoke-JPVCanonicalStripeAzureConvergence.ps1",
            "src/JPVOS/JPVOS.csproj",
            "src/JPVOS/Api/CheckoutController.cs",
            "src/JPVOS/Api/CheckoutConfigStatusController.cs",
            "src/JPVOS/Api/StripeWebhookController.cs",
            "src/JPVOS/Infrastructure/Stripe/StripePricingLoader.cs",
            "src/JPVOS/Infrastructure/Stripe/StripeCheckoutService.cs"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Missing required source file: $file"
            }
          }

          if (Test-Path "infrastructure/stripe/generated") {
            $generated = Get-ChildItem "infrastructure/stripe/generated" -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^stripe-(pricing|env)\.' }
            if ($generated) {
              throw "Generated processor pricing artifacts must not be committed as source authority: $($generated.Name -join ', ')"
            }
          }

      - name: Validate canonical pricing authority
        run: node scripts/validate-canonical-pricing.mjs

      - name: Build JPVOS
        run: dotnet build src/JPVOS/JPVOS.csproj --configuration Release
