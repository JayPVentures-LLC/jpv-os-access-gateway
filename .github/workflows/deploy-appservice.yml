name: deploy-appservice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AZURE_RESOURCE_GROUP: rg-jpv-os-access-gateway
      AZURE_WEBAPP_NAME: jpv-os-access-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./src/JPVOS/JPVOS.csproj

      - name: Build
        run: dotnet build ./src/JPVOS/JPVOS.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./src/JPVOS/JPVOS.csproj -c Release -o ./publish

      - name: Azure Login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Stripe runtime
        run: |
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings \
              STRIPE_MODE="live" \
              STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
              STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --output none

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Wait for startup
        run: sleep 20

      - name: Post-deploy health check
        run: |
          set -euo pipefail
          curl -sSf \
            https://jpv-os-access-gateway.azurewebsites.net/api/health \
            | jq -e '.status == "healthy"'

      - name: Verify homepage
        run: |
          set -euo pipefail
          homepage=$(curl -sSf https://jpv-os-access-gateway.azurewebsites.net/)
          printf '%s' "$homepage" | grep -Fq "init-home.css"
          printf '%s' "$homepage" | grep -Fq "Welcome to the Venture"
          printf '%s' "$homepage" | grep -Fq "Enter the Ecosystem"
