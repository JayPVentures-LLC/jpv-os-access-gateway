name: deploy-appservice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AZURE_RESOURCE_GROUP: rg-jpv-os-access-gateway
      AZURE_WEBAPP_NAME: jpv-os-access-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./src/JPVOS/JPVOS.csproj

      - name: Build
        run: dotnet build ./src/JPVOS/JPVOS.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./src/JPVOS/JPVOS.csproj -c Release -o ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Stripe runtime secrets
        run: |
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings \
              STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
              STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
              STRIPE_AUTOMATIC_TAX_ENABLED="false" \
              STRIPE_PRICE_MEMBER_MONTHLY="${{ secrets.STRIPE_PRICE_MEMBER_MONTHLY }}" \
              STRIPE_PRICE_MEMBER_ANNUAL="${{ secrets.STRIPE_PRICE_MEMBER_ANNUAL }}" \
              STRIPE_PRICE_VIP_MONTHLY="${{ secrets.STRIPE_PRICE_VIP_MONTHLY }}" \
              STRIPE_PRICE_VIP_ANNUAL="${{ secrets.STRIPE_PRICE_VIP_ANNUAL }}" \
              STRIPE_PRICE_CREATOR_LANE_MONTHLY="${{ secrets.STRIPE_PRICE_CREATOR_LANE_MONTHLY }}" \
              STRIPE_PRICE_OPERATOR_MONTHLY="${{ secrets.STRIPE_PRICE_OPERATOR_MONTHLY }}" \
              STRIPE_PRICE_ENTERPRISE_MONTHLY="${{ secrets.STRIPE_PRICE_ENTERPRISE_MONTHLY }}" \
            --output none

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Restart App Service
        run: |
          az webapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME"

      - name: Wait for startup
        run: sleep 20

      - name: Post-deploy health check
        run: |
          set -e

          echo "Checking health..."
          curl -sSf \
            https://jpv-os-access-gateway.azurewebsites.net/api/health \
            | jq -e '.status == "healthy"'

          echo "Health check passed."

      - name: Verify homepage
        run: |
          set -e

          homepage=$(curl -sSf \
            https://jpv-os-access-gateway.azurewebsites.net/)

          echo "$homepage" | grep "init-home.css"
          echo "$homepage" | grep "Welcome to the Venture"
          echo "$homepage" | grep "Enter the Ecosystem"

          echo "Homepage verification passed."