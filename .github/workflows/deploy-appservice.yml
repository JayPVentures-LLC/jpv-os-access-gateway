name: deploy-appservice

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-appservice
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      AZURE_WEBAPP_NAME: jpv-os-access-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./src/JPVOS/JPVOS.csproj

      - name: Build
        run: dotnet build ./src/JPVOS/JPVOS.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./src/JPVOS/JPVOS.csproj -c Release -o ./publish

      - name: Deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

      - name: Wait for startup
        run: sleep 20

      - name: Post-deploy health and attention-gate verification
        run: |
          set -euo pipefail
          health=$(curl -sSf https://jpv-os-access-gateway.azurewebsites.net/health)
          printf '%s' "$health" | jq -e '.status == "healthy"'
          printf '%s' "$health" | jq -e '.productionAttentionAdmission.registered == true'
          printf '%s' "$health" | jq -e '.productionAttentionAdmission.mode == "fail-closed"'

      - name: Verify homepage
        run: |
          set -euo pipefail
          homepage=$(curl -sSf https://jpv-os-access-gateway.azurewebsites.net/)
          printf '%s' "$homepage" | grep -Fq "init-home.css"
          printf '%s' "$homepage" | grep -Fq "Welcome to the Venture"
          printf '%s' "$homepage" | grep -Fq "Enter the Ecosystem"
