# Canonical deployment configuration for the access gateway.
# Deployment authority must map only to infrastructure that exists and is controlled.

app = "jpv-os"
primary_region = "iad"

[build]
  image = "ghcr.io/jaypventures-llc/jpv-os:f2e8c23a03d314f14b55af432fafcffaa1a7f525"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  JPV_DEPLOYMENT_AUTHORITY = "production"
  JPV_FOUNDER_ID = "founder"
  JPV_FOUNDER_ACCESS_KEY_SHA256 = "7096CFC6B9595863203F31A33F574B572B7EDD87B0ACBF0A4205A5EA5984817B"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
